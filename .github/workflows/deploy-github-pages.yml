name: Deploy GitHub Pages Discovery Hub

on:
  push:
    branches: [main]
    paths:
      - github-pages/**
      - .github/workflows/deploy-github-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify discovery hub source
        run: npm run discovery:verify-github-pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Submit GitHub Pages sitemap to IndexNow
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          INDEXNOW_KEY_FILE_DIRECTORY: github-pages
        run: npm run indexnow:submit

      - name: Verify published discovery assets
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: npm run discovery:verify-published-github-pages
